name: Quality, tests and image audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install quality dependencies in this isolated job
        run: python -m pip install -r requirements-quality.txt
      - name: Check quality dependency closure
        run: python scripts/check_lock.py requirements-quality.txt
      - run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Documentation and available examples
        run: python scripts/check_docs.py

      - name: Audit runtime, test and quality dependencies
        run: python scripts/audit_dependencies.py
      - name: Keep audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.os }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_lock.py requirements.txt requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: reports/tests.xml
          retention-days: 7
          if-no-files-found: error
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build, non-root health and image scan
        run: python scripts/check_image.py --image cinevault-web:ci-${{ github.sha }}
      - name: Keep image audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-audit
          path: reports/
          retention-days: 7
          if-no-files-found: error
